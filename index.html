<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>翻牌遊戲</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f3f1eb; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #292929; display: flex; flex-direction: column; align-items: center; padding: 36px 24px; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 2px; }
    .hint { margin: 0 0 28px; color: #777; font-size: 14px; }
    .game-board { width: min(1200px, 100%); display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; }
    .card { aspect-ratio: 1 / 1.15; perspective: 800px; cursor: pointer; user-select: none; }
    .card.disabled { cursor: default; }
    .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.45s ease; }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; font-weight: 700; font-size: clamp(13px, 1.4vw, 19px); box-shadow: 0 3px 8px rgba(0,0,0,.12), inset 0 0 0 1px rgba(255,255,255,.35); }
    .card-front { background: #fff; color: #292929; }
    .card-back { background: #555; color: #fff; transform: rotateY(180deg); }
    .card.disabled .card-front, .card.disabled .card-back { background: #888; }
    .card:not(.disabled):hover .card-inner { transform: translateY(-4px); }
    .card:not(.disabled):active .card-inner { transform: translateY(0); }
    .counter { margin-top: 22px; padding: 8px 16px; border-radius: 999px; background: #fff; color: #666; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
    .reset { margin-top: 14px; padding: 8px 18px; border: 0; border-radius: 8px; background: #292929; color: #fff; font-size: 14px; cursor: pointer; }
    .reset:hover { background: #444; }
    @media (max-width: 900px) { .game-board { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 500px) { body { padding: 20px 12px; } h1 { font-size: 22px; } .game-board { grid-template-columns: repeat(4, 1fr); gap: 7px; } .card-face { border-radius: 7px; padding: 5px; font-size: 11px; } }
  </style>
</head>
<body>
  <h1>翻牌遊戲</h1>
  <p class="hint">點擊卡牌，看看背後藏著誰</p>
  <div class="game-board" id="gameBoard"></div>
  <div class="counter" id="counter">已翻牌 0 / 32</div>
  <button class="reset" id="resetButton">重新開始</button>
  <script>
    const cards = [
      ["落日飛車", "王意義"], ["瑪丁娜", "陳以內"], ["排球少年", "陳皇后"], ["底片相機", "往小器"],
      ["爬山", "摩割愛"], ["MINECRAFT", "致癌"], ["貓派", "跟餐廳"], ["STRAY KIDS", "窩窩頭"],
      ["0050", "外圍賽"], ["老花眼鏡", "欸公園"], ["素食者", "看才能"], ["花蓮飆仔", "酷哦許"],
      ["中山逛街", "與合作"], ["戀愛腦", "卡關"], ["時光二手書店", "與口感"], ["BL", "誒褲子"],
      ["富邦悍將", "王令麟"], ["扭蛋", "新份額"], ["肉圓加辣", "吳尊"], ["A321", "嗷嗷家"],
      ["DUA LIPA", "恩情噢"], ["睡覺", "岑哥"], ["女性主義", "歐氣欸"], ["芒果醬", "內能"],
      ["ONE OK ROCK", "紅通通"], ["忍者哈特利", "你你"], ["西班牙", "誒像欸"], ["哈利波特", "鷗科欸"],
      ["台積電", "好誒哈"], ["總鋪師", "坤坤"], ["獵人", "嗯九"], ["福岡軟銀鷹", "邊堀"]
    ];
    const board = document.getElementById("gameBoard");
    const counter = document.getElementById("counter");
    const resetButton = document.getElementById("resetButton");
    let flippedCount = 0;

    function createCards() {
      board.innerHTML = "";
      flippedCount = 0;
      updateCounter();
      cards.forEach(([frontText, backText]) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<div class="card-inner"><div class="card-face card-front">${frontText}</div><div class="card-face card-back">${backText}</div></div>`;
        card.addEventListener("click", () => {
          if (card.classList.contains("disabled")) return;
          card.classList.add("flipped", "disabled");
          flippedCount++;
          updateCounter();
        });
        board.appendChild(card);
      });
    }

    function updateCounter() { counter.textContent = `已翻牌 ${flippedCount} / ${cards.length}`; }
    resetButton.addEventListener("click", createCards);
    createCards();
  </script>
</body>
</html>
